<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' blob:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>订单差异检查 · 离线样品</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#182844;font:16px/1.65 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1120px;margin:auto;padding:48px 24px}h1{font-size:36px;letter-spacing:-1px;margin:8px 0}h2{font-size:20px;margin:0 0 16px}.tag{font-size:13px;color:#466188;font-weight:700}.muted{color:#61718a}.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:28px 0}.panel{background:white;border:1px solid #dfe5ef;border-radius:16px;padding:24px;box-shadow:0 8px 26px #18284405}label{display:block;margin:16px 0 6px;font-size:14px}select,input[type=file]{width:100%;padding:10px;border:1px solid #cad3e2;border-radius:8px;background:white;color:inherit}button{border:0;border-radius:8px;padding:12px 20px;background:#2357de;color:white;font:inherit;cursor:pointer;margin:4px 8px 4px 0}button.secondary{background:#e9efff;color:#23457c}button:disabled{opacity:.45;cursor:default}.actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.actions label{margin:0 14px 0 0}.summary{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.pill{background:#eaf0ff;border-radius:9px;padding:10px 16px}.error{color:#9c2131;background:#fff0f1;border-radius:8px;padding:12px;display:none}.tablewrap{overflow:auto;max-height:500px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:12px;border-bottom:1px solid #e4e9f2;white-space:pre-wrap;overflow-wrap:anywhere;min-width:120px;max-width:340px}th{background:#f4f6fb;position:sticky;top:0}.different{color:#a44c12}.note{font-size:14px;margin-top:20px}footer{font-size:13px;color:#61718a;margin-top:24px}@media(max-width:650px){.cards{grid-template-columns:1fr}main{padding:24px 16px}h1{font-size:28px}}
</style></head><body><main><span class="tag">本地处理 · 无需账号 · 样品 v0.1</span><h1>两份订单，差在哪里？</h1><p class="muted">按订单号匹配记录，检查缺单和字段差异。文件保留在当前浏览器中。</p><button id="demo" class="secondary">载入演示订单</button>
<div class="cards"><section class="panel"><h2>表 A · 原始记录</h2><input id="fileA" type="file" accept=".csv,text/csv" aria-label="选择表 A"><p class="muted" id="infoA">选择 CSV 文件，或先体验演示。</p><label for="keyA">订单号列</label><select id="keyA"></select><label for="fieldA">比较字段</label><select id="fieldA"></select></section><section class="panel"><h2>表 B · 待核对记录</h2><input id="fileB" type="file" accept=".csv,text/csv" aria-label="选择表 B"><p class="muted" id="infoB">可使用不同的表头名称。</p><label for="keyB">订单号列</label><select id="keyB"></select><label for="fieldB">比较字段</label><select id="fieldB"></select></section></div>
<section class="panel"><div class="actions"><button id="run" disabled>检查差异</button><button id="export" class="secondary" disabled>导出差异 CSV</button><label><input id="trim" type="checkbox" checked> 忽略字段首尾空格</label><label><input id="only" type="checkbox" checked> 只看差异</label></div><p id="error" class="error" role="alert"></p><div id="summary" class="summary"></div><div class="tablewrap"><table><thead><tr><th>订单号</th><th>A 字段</th><th>B 字段</th><th>检查结果</th></tr></thead><tbody id="body"></tbody></table></div><p class="note muted" id="state">尚未检查。演示含一致、字段不同、仅 A 存在、仅 B 存在四类记录。</p></section>
<footer>支持逗号分隔的 UTF-8 CSV，单文件最多 5 MB。比较为文本比较，100 与 100.00 会显示不同；不计算金额或判断财务正确性。重复订单号会停止检查，避免隐式覆盖。刷新或关闭页面即清除数据。</footer></main><script src="core.js"></script><script>
'use strict';
const $ = id => document.getElementById(id); let tables = {}, records = [], generation = {A:0,B:0};
function error(message) { $('error').textContent=message; $('error').style.display=message?'block':'none'; }
function invalidate(){records=[];$('export').disabled=true;$('summary').replaceChildren();$('body').replaceChildren();$('state').textContent='输入或规则已变更，请重新检查。';error('');}
function assign(side,table,name){tables[side]=table;for(const type of ['key','field']){const el=$(type+side);el.replaceChildren();table.headers.forEach(h=>{const op=document.createElement('option');op.value=h;op.textContent=h;el.append(op);});if(type==='field'&&table.headers.length>1)el.selectedIndex=1;}$('info'+side).textContent=name+' · '+table.rows.length+' 条记录';$('run').disabled=!(tables.A&&tables.B);invalidate();}
for(const side of ['A','B']) { $('file'+side).addEventListener('change',async event=>{const version=++generation[side];delete tables[side];invalidate();$('run').disabled=true;const file=event.target.files[0];if(!file)return;try{if(file.size>5*1024*1024)throw Error('单文件不能超过 5 MB');const content=await file.arrayBuffer();if(version!==generation[side])return;const text=new TextDecoder('utf-8',{fatal:true}).decode(content);assign(side,OrderCheck.parse(text),file.name);}catch(e){if(version===generation[side]){$('info'+side).textContent='文件未载入';error(e.message);}}});for(const type of ['key','field'])$(type+side).addEventListener('change',invalidate);}
$('trim').addEventListener('change',invalidate);
$('demo').onclick=()=>{generation.A++;generation.B++;$('fileA').value='';$('fileB').value='';assign('A',OrderCheck.parse('订单号,金额\nA001,100.00\nA002,200.00\nA003,300.00'),'演示 A');assign('B',OrderCheck.parse('订单编号,实收\nA001,100.00\nA002,190.00\nA004,400.00'),'演示 B');};
function render(){const shown=$('only').checked?records.filter(r=>r.status!=='一致'):records;$('body').replaceChildren();for(const r of shown.slice(0,1000)){const tr=document.createElement('tr');if(r.status!=='一致')tr.className='different';for(const v of [r.id,r.a,r.b,r.status]){const td=document.createElement('td');td.textContent=v;tr.append(td);}$('body').append(tr);}$('state').textContent='共 '+records.length+' 条，当前筛选 '+shown.length+' 条。'+(shown.length>1000?'页面仅展示前 1000 条，导出包含完整差异。':'');}
$('only').onchange=()=>{if(records.length)render();};
$('run').onclick=()=>{invalidate();try{records=OrderCheck.compare(tables.A,tables.B,$('keyA').value,$('keyB').value,$('fieldA').value,$('fieldB').value,$('trim').checked);for(const status of ['一致','字段不同','仅 A 存在','仅 B 存在']){const el=document.createElement('span');el.className='pill';el.textContent=status+' '+records.filter(r=>r.status===status).length;$('summary').append(el);}$('export').disabled=false;render();}catch(e){error(e.message);}};
$('export').onclick=()=>{const blob=new Blob([OrderCheck.csv(records.filter(r=>r.status!=='一致'))],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='订单差异.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
</script></body></html>
